<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <!-- Safety rule: sirf apni files, https images aur local files allowed -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: file: data:; style-src 'self'; script-src 'self'" />
  <title>Reality Weaver</title>

  <!-- Yahan style.css jud rahi hai -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Upar ka heading ===== -->
  <header>
    <h1>Reality Weaver</h1>
    <p>Multiverse se wallpapers dhoondo, lagao aur vaults mein sambhalo</p>
  </header>

  <!-- ===== Tab buttons (CSS mein: nav, .tab, .tab.active) ===== -->
  <nav>
    <button id="tabExplore" class="tab active">Multiversal Portal</button>
    <button id="tabVaults" class="tab">Sanctum of Memories</button>
  </nav>

  <!-- ===== B1 + B2: Explore section ===== -->
  <section id="exploreSection">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Kuch likho: space, mountains, anime..." />

      <select id="categorySelect">
        <option value="111">Sab categories</option>
        <option value="100">General</option>
        <option value="010">Anime</option>
        <option value="001">People</option>
      </select>

      <select id="sortSelect">
        <option value="relevance">Relevance</option>
        <option value="toplist">Top</option>
        <option value="random">Random</option>
      </select>

      <!-- B2: Wallpaper kaise fit ho -->
      <select id="scaleSelect">
        <option value="fill">Fill (crop karke)</option>
        <option value="fit">Fit</option>
        <option value="stretch">Stretch</option>
        <option value="center">Center</option>
      </select>

      <button id="searchBtn">Search</button>
    </div>

    <p id="statusText"></p>

    <!-- Search ke wallpapers yahan cards ban kar aayenge (.grid) -->
    <div id="results" class="grid"></div>
  </section>

  <!-- ===== B3: Vault section (shuru mein chhupa hua: class="hidden") ===== -->
  <section id="vaultSection" class="hidden">
    <div class="controls">
      <input type="text" id="vaultNameInput" placeholder="Naye vault ka naam" />
      <button id="createVaultBtn">Vault banao</button>

      <select id="vaultSelect"></select>
      <button id="deleteVaultBtn">Vault delete karo</button>
    </div>

    <div class="controls">
      <button id="addLocalBtn">Computer se images jodo</button>
      <button id="shuffleBtn">Shuffle</button>

      <label>Har
        <input type="number" id="intervalInput" value="5" min="1" />
        minute mein badlo
      </label>
      <button id="startCycleBtn">Cycle shuru</button>
      <button id="stopCycleBtn">Cycle band</button>
    </div>

    <p id="vaultStatus"></p>
    <div id="vaultImages" class="grid"></div>
  </section>

  <!-- Yahan script.js jud rahi hai (hamesha sabse neeche) -->
  <script src="script.js"></script>
</body>
</html>
