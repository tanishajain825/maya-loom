<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAYALOOM Wallpapers</title>

    <!-- CSS file connect karna -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- =====================================================
         INTRO: gate aata hai -> darwaze khulte hain -> MayaLoom
         ===================================================== -->
    <div id="intro">
        <div class="stars"></div>

        <!-- Gate ke dono taraf pillars -->
        <div class="pillar p1"></div>
        <div class="pillar p2"></div>
        <div class="pillar p3"></div>
        <div class="pillar p4"></div>

        <!-- Lehraate roshni ke ribbons -->
        <div class="ribbon left"></div>
        <div class="ribbon right"></div>

        <!-- Neeche chamakta paani -->
        <div class="floor">
            <span class="ring r1"></span>
            <span class="ring r2"></span>
            <span class="ring r3"></span>
        </div>

        <!-- Gate + logo -->
        <div class="gate-wrap">
            <div class="arch">
                <div class="gate">
                    <div class="portal"></div>
                    <div class="door left"></div>
                    <div class="door right"></div>
                </div>
            </div>

            <div class="logo">
                <h2><span class="cap">M</span>aya <span class="cap">L</span>oom</h2>
                <span class="swirl"></span>
                <p>YOUR DESKTOP, YOUR UNIVERSE.</p>
            </div>
        </div>

        <!-- Udti pankhudiyan -->
        <div class="petal pt1"></div>
        <div class="petal pt2"></div>
        <div class="petal pt3"></div>
        <div class="petal pt4"></div>
        <div class="petal pt5"></div>
        <div class="petal pt6"></div>

        <!-- Chamakte phool aur jhaadiyan -->
        <div class="flower f1"></div>
        <div class="flower f2"></div>
        <div class="flower f3"></div>
        <div class="flower f4"></div>
        <div class="bush left"></div>
        <div class="bush right"></div>


        <span class="skip-hint">Click anywhere to skip</span>
    </div>

    <!-- MAIN APP -->
    <!-- Website heading -->
    <header>
        <h1>✦ MAYALOOM</h1>
        <p>Find your favourite wallpaper!</p>
    </header>

    <!-- Navigation buttons -->
    <nav>
        <button onclick="showHome()">Home</button>
        <button onclick="showSaved()">Saved Wallpapers</button>
    </nav>

    <h2>CATEGORIES</h2>

    <div class="category-slider">
        <button onclick="filterCategory('all')">All</button>
        <button onclick="filterCategory('moon')">Moon</button>
        <button onclick="filterCategory('nature')">Nature</button>
        <button onclick="filterCategory('mountains')">Mountains</button>
        <button onclick="filterCategory('flower')">Flower</button>
    </div>

    <!-- Search box -->
    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search wallpapers..."
        >
        <button onclick="searchWallpapers()">Search</button>
    </div>

    <!-- Wallpaper heading -->
    <h2 id="heading">Top Wallpapers</h2>

    <!-- JavaScript yahan wallpaper cards show karega -->
    <div id="wallpaperContainer" class="wallpaper-grid"></div>

    <!-- JavaScript file connect karna -->
    <script src="script.js"></script>

</body>
</html>
